name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint, tests & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The local `lint` script auto-fixes, which would let CI pass on code
      # that is not actually formatted in the repo.
      - name: Lint
        run: npx eslint "{src,test}/**/*.ts" --max-warnings 0

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --ci

      # Over HTTP against the fake model: no OpenAI key, no network.
      - name: E2E tests
        run: npm run test:e2e -- --ci

      - name: Build
        run: npm run build
